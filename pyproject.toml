[project]
name = "combinators-py"
version = "0.5.0"
authors = [{name = "prostomarkeloff", email="prostomarkeloff@was.there" }]
description = "Declarative way to build systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kungfu-fp",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

[tool.uv.sources]
kungfu = { git = "https://github.com/timoniq/kungfu.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:hypothesis.*",
]

[tool.coverage.run]
branch = true
source = ["combinators"]
omit = [
    "combinators/**/fluent/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "@typing.overload",
    "@overload",
]
show_missing = true
skip_covered = false
